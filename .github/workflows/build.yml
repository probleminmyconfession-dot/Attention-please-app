name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project and add Firebase config
        run: |
          mkdir tmp
          unzip -o "files 3.zip" -d tmp
          P=$(find tmp -name project.zip | head -n1)
          if [ -n "$P" ]; then
            unzip -o "$P"
          else
            D=$(dirname "$(find tmp -name settings.gradle.kts | head -n1)")
            cp -r "$D"/. .
          fi
          ls
          cp google-services.json app/google-services.json

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Attention APK v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
